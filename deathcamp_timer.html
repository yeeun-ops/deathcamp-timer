<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원패스 스파르타 — 데스캠프 타이머</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #12151c;
    --border: #1e2330;
    --accent-study: #3b82f6;
    --accent-break: #22c55e;
    --accent-meal: #f59e0b;
    --accent-done: #6b7280;
    --text: #f0f4ff;
    --text-muted: #6b7897;
    --text-dim: #3a4060;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 상단 헤더 */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.2rem 2.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .logo {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .logo span {
    color: var(--accent-study);
  }

  .clock-live {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.4rem;
    color: var(--text-muted);
    letter-spacing: 0.06em;
  }

  .date-live {
    font-size: 0.85rem;
    color: var(--text-dim);
    text-align: right;
  }

  /* 메인 레이아웃 */
  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 0;
    overflow: hidden;
  }

  /* 좌측: 현재 타이머 */
  .timer-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    position: relative;
    gap: 1.2rem;
  }

  .block-badge {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.35rem 1.2rem;
    border-radius: 2px;
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  }

  .block-title {
    font-size: 3.5rem;
    font-weight: 900;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .timer-digits {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: clamp(7rem, 18vw, 14rem);
    font-weight: 900;
    line-height: 1;
    color: var(--accent);
    letter-spacing: 0.04em;
    text-shadow: 0 0 80px color-mix(in srgb, var(--accent) 30%, transparent);
    transition: color 0.5s ease;
  }

  .time-range-label {
    font-size: 1.1rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    font-family: 'Share Tech Mono', monospace;
  }

  /* 프로그레스 바 */
  .progress-wrap {
    width: 80%;
    max-width: 700px;
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 1s linear, background 0.5s;
    box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 60%, transparent);
  }

  .next-label {
    font-size: 0.9rem;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  .next-label span {
    color: var(--text-muted);
  }

  /* 우측: 시간표 */
  .schedule-panel {
    border-left: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 1rem 0;
  }

  .schedule-panel::-webkit-scrollbar { width: 0; }

  .schedule-label {
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 0.5rem 1.5rem 1rem;
    font-weight: 700;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.7rem 1.5rem;
    border-left: 3px solid transparent;
    transition: all 0.3s ease;
    cursor: default;
  }

  .row.active {
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    border-left-color: var(--accent);
  }

  .row.done {
    opacity: 0.3;
  }

  .row-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--accent);
  }

  .row.done .row-dot {
    background: var(--text-dim);
  }

  .row-name {
    flex: 1;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text);
  }

  .row.active .row-name {
    color: var(--accent);
  }

  .row.done .row-name {
    color: var(--text-dim);
  }

  .row-time {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .row.active .row-time {
    color: var(--text-muted);
  }

  /* 배경 그리드 효과 */
  .timer-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.25;
    pointer-events: none;
  }

  /* 상태별 accent 색 */
  .accent-study { --accent: var(--accent-study); }
  .accent-break { --accent: var(--accent-break); }
  .accent-meal  { --accent: var(--accent-meal); }
  .accent-done  { --accent: var(--accent-done); }
</style>
</head>
<body>

<div class="header">
  <div class="logo">원패스 <span>스파르타</span> — Death Camp</div>
  <div style="text-align:right">
    <div class="clock-live" id="clock-live">00:00:00</div>
    <div class="date-live" id="date-live"></div>
  </div>
</div>

<div class="main">
  <div class="timer-panel accent-study" id="timer-panel">
    <div class="block-badge" id="block-badge">학습</div>
    <div class="block-title" id="block-title">1교시</div>
    <div class="timer-digits" id="timer-digits">00:00</div>
    <div class="time-range-label" id="time-range-label">09:40 → 10:50</div>
    <div class="progress-wrap">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div class="next-label" id="next-label">다음: <span>휴식 (10:50)</span></div>
  </div>

  <div class="schedule-panel">
    <div class="schedule-label">오늘 일정</div>
    <div id="schedule-list"></div>
  </div>
</div>

<script>
const schedule = [
  { name: "입실",  type: "break", start: "09:20", end: "09:40", badge: "준비" },
  { name: "2교시", type: "study", start: "09:40", end: "10:50", badge: "데스캠프" },
  { name: "휴식",  type: "break", start: "10:50", end: "11:10", badge: "휴식" },
  { name: "3교시", type: "study", start: "11:10", end: "12:20", badge: "데스캠프" },
  { name: "점심",  type: "meal",  start: "12:20", end: "13:30", badge: "점심" },
  { name: "4교시", type: "study", start: "13:30", end: "14:40", badge: "데스캠프" },
  { name: "휴식",  type: "break", start: "14:40", end: "15:00", badge: "휴식" },
  { name: "5교시", type: "study", start: "15:00", end: "16:10", badge: "데스캠프" },
  { name: "휴식",  type: "break", start: "16:10", end: "16:30", badge: "휴식" },
  { name: "6교시", type: "study", start: "16:30", end: "17:40", badge: "데스캠프" },
  { name: "저녁",  type: "meal",  start: "17:40", end: "18:50", badge: "저녁" },
  { name: "7교시", type: "study", start: "18:50", end: "20:20", badge: "데스캠프" },
];

function toSec(str) {
  const [h, m] = str.split(":").map(Number);
  return h * 3600 + m * 60;
}

function pad(n) { return String(n).padStart(2, "0"); }

function formatRemain(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return pad(m) + ":" + pad(s);
}

function buildSchedule(activeIdx) {
  const list = document.getElementById("schedule-list");
  list.innerHTML = "";
  schedule.forEach((b, i) => {
    const row = document.createElement("div");
    const cls = i === activeIdx ? "row active" : i < activeIdx ? "row done" : "row";
    row.className = cls;
    row.style.setProperty("--accent",
      b.type === "study" ? "var(--accent-study)" :
      b.type === "meal"  ? "var(--accent-meal)"  : "var(--accent-break)");
    row.innerHTML = `
      <div class="row-dot"></div>
      <div class="row-name">${b.name}</div>
      <div class="row-time">${b.start}–${b.end}</div>
    `;
    list.appendChild(row);
  });
}

function updateClock() {
  const now = new Date();
  document.getElementById("clock-live").textContent =
    pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());

  const days = ["일","월","화","수","목","금","토"];
  document.getElementById("date-live").textContent =
    `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} (${days[now.getDay()]})`;
}


const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function beep(frequency, duration, delay = 0) {
  setTimeout(() => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = "sine";
    osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + duration);
  }, delay);
}

function soundStart() {
  beep(880, 1.2);
}

function soundEnd() {
  beep(660, 0.25, 0);
  beep(660, 0.25, 350);
  beep(660, 0.25, 700);
}

let lastBlockIdx = null;

function tick() {
  const now = new Date();
  const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

  const panel = document.getElementById("timer-panel");
  const badge = document.getElementById("block-badge");
  const title = document.getElementById("block-title");
  const digits = document.getElementById("timer-digits");
  const rangeLabel = document.getElementById("time-range-label");
  const fill = document.getElementById("progress-fill");
  const nextLabel = document.getElementById("next-label");

  let found = false;
  for (let i = 0; i < schedule.length; i++) {
    const s = toSec(schedule[i].start);
    const e = toSec(schedule[i].end);
    if (nowSec >= s && nowSec < e) {
      const remain = e - nowSec;
      const total = e - s;
      const pct = Math.round((total - remain) / total * 100);

      const accentClass = schedule[i].type === "study" ? "accent-study"
                        : schedule[i].type === "meal"  ? "accent-meal"
                        : "accent-break";

      panel.className = "timer-panel " + accentClass;
      badge.textContent = schedule[i].badge;
      title.textContent = schedule[i].name;
      digits.textContent = formatRemain(remain);
      rangeLabel.textContent = schedule[i].start + " → " + schedule[i].end;
      fill.style.width = pct + "%";

      if (i + 1 < schedule.length) {
        nextLabel.innerHTML = `다음: <span>${schedule[i+1].name} (${schedule[i+1].start})</span>`;
      } else {
        nextLabel.innerHTML = `<span>오늘의 마지막 시간입니다</span>`;
      }

      if (lastBlockIdx !== null && lastBlockIdx !== i) {
        soundStart();
      }
      lastBlockIdx = i;

      buildSchedule(i);
      found = true;
      break;
    }
  }

  if (!found) {
    const firstSec = toSec(schedule[0].start);

    if (nowSec < firstSec) {
      const remain = firstSec - nowSec;
      panel.className = "timer-panel accent-break";
      badge.textContent = "대기";
      title.textContent = "입실 전";
      digits.textContent = formatRemain(remain);
      rangeLabel.textContent = "입실 시작 → " + schedule[0].start;
      fill.style.width = "0%";
      nextLabel.innerHTML = `입실까지 <span>${formatRemain(remain)}</span>`;
      if (lastBlockIdx !== null) soundEnd();
      lastBlockIdx = null;
      buildSchedule(-1);
    } else {
      panel.className = "timer-panel accent-done";
      badge.textContent = "종료";
      title.textContent = "오늘 일정 완료";
      digits.textContent = "수고하셨습니다!";
      rangeLabel.textContent = "모든 일정이 끝났습니다";
      fill.style.width = "100%";
      nextLabel.innerHTML = `<span>내일도 힘냅시다!</span>`;
      if (lastBlockIdx !== null) soundEnd();
      lastBlockIdx = -99;
      buildSchedule(schedule.length);
    }
  }
}

updateClock();
tick();
setInterval(updateClock, 1000);
setInterval(tick, 1000);

// 자동 전체화면
document.addEventListener("click", () => {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
  }
});
</script>
</body>
</html>
